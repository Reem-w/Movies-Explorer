<!--NavBar-->


<nav class="navbar navbar-expand-lg " [class.dark-navbar]="isDarkMode">
  <div class="container">
    <a class="navbar-brand" [routerLink]="['home']">Movie Explorer</a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <div class="wrapper d-lg-flex justify-content-between">
        <ul class="navbar-nav">
          <li class="nav-item basic-btn">
             <mat-icon class="mx-2">home</mat-icon>
            <a class="nav-link" [routerLink]="['home']"  routerLinkActive="active">{{ 'HOME' | translate }}</a>
          </li>
          <li class="nav-item basic-btn">
             <mat-icon class="mx-2">movie</mat-icon>

            <a class="nav-link" [routerLink]="['home']" routerLinkActive="active">{{ 'MOVIES' | translate }}</a>
          </li>
        </ul>
        <div class="search-container">
          <mat-icon class="mx-2">search</mat-icon>

          <input
            type="text"
            class="search-input"
            placeholder="{{ 'SEARCH' | translate }}"
            [(ngModel)]="searchQuery"
            (focus)="openSearchModal()"

          />
        </div>
        <div class="d-flex align-items-center gap-2">
          <div class="d-flex align-items-center">
            <p-toggleswitch
            class="mx-1"
            [(ngModel)]="isDarkMode"
            (onChange)="toggleTheme()"
            inputId="custom"
            [pt]="{
              slider: {
                class: isDarkMode
                  ? 'bg-blue-300! rounded-md!'
                  : 'bg-slate-300! dark:bg-slate-600! rounded-md!',
              },
              handle: { class: isDarkMode ? 'bg-blue-900!' : 'bg-slate-500!' },
            }"
          />
          {{ 'DARK_MODE' | translate }}

          </div>

          <button class="lang-btn" *ngIf="language === 'en'" (click)="changeLanguage('ar')">
            عربي
          </button>
          <button class="lang-btn" *ngIf="language === 'ar'" (click)="changeLanguage('en')">
            ENGLISH
          </button>
        </div>
      </div>
    </div>
  </div>
</nav>
<!-- <div class="search-overlay"></div> -->

<!--End of NavBar-->


<!-- Search Overlay -->
<div
  class="search-overlay"
  *ngIf="isSearchOpen"
  (click)="closeSearchModal()"
>
  <div
    class="search-results-panel"
    (click)="$event.stopPropagation()"
  >
    <div class="search-heading">
      <!-- <h3>Search Results</h3> -->
        <input
            type="text"
            class="search-input"
            placeholder="{{ 'SEARCH' | translate }}"
            [(ngModel)]="searchQuery"
            (input)="onSearchInput()"
          />

      <button
        class="close-search"
        type="button"
        aria-label="Close search"
        (click)="closeSearchModal()"
      >
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <p *ngIf="searchQuery.trim().length === 0" class="search-hint">
      discover movies...
    </p>

    <p
      *ngIf="searchQuery.trim().length > 0 && searchResults.length === 0"
      class="search-hint"
    >
      No movies found.
    </p>

    <div class="search-results">
      <button
        type="button"
        class="search-result"
        *ngFor="let movie of searchResults"
        (click)="openMovie(movie.id)"
      >
        <img
          [src]="movie.poster_path
            ? baseImgUrl + '/w92' + movie.poster_path
            : 'images/no_picture.png'"
          [alt]="movie.title"
        />

        <div class="movie-info">
          <h4>{{ movie.title }}</h4>

          <div class="movie-meta">
            <span>{{ movie.release_date | slice:0:4 }}</span>

            <span class="movie-rating">
              <mat-icon>star</mat-icon>
              {{ movie.vote_average | number:'1.1-1' }}
            </span>
          </div>
        </div>

        <mat-icon class="result-arrow">arrow_forward</mat-icon>
      </button>
    </div>
  </div>
</div>
